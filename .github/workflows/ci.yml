name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Fixtures match the models
        run: |
          python -m contracts.generate_fixtures
          git diff --exit-code contracts/fixtures contracts/schemas \
            || (echo "::error::Fixtures are stale. Run: python -m contracts.generate_fixtures" && exit 1)

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Types match the contracts
        run: |
          npm run gen:types
          git diff --exit-code src/types \
            || (echo "::error::Frontend types are stale. Run: npm run gen:types" && exit 1)

      - name: Typecheck and build
        run: npm run build
