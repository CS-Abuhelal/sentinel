name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Contract tests
        run: pytest -q

      - name: Fixtures match the models
        run: |
          python -m contracts.generate_fixtures
          git diff --exit-code contracts/fixtures contracts/schemas \
            || (echo "::error::Fixtures are stale. Run: python -m contracts.generate_fixtures" && exit 1)
