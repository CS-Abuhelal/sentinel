title: Password guessing during an unrelated maintenance window
description: >-
  An address that has never logged in to this host makes 13 failed SSH password attempts against
  jdoe at 02:40, 15 seconds apart, then logs in with the guessed password at 02:44. A change
  window (CHG-2060) covers that time and names this host, but it is for patching packages and its
  only account is svc_backup. It does not mention jdoe or the source address, so it does not
  explain the activity.
expected_classification: malicious
required_evidence: [auth_history, change_window]
changes:
  - change_id: CHG-2060
    title: Patch web server packages on victim-web-01
    start: "2026-09-28T01:00:00Z"
    end: "2026-09-28T04:00:00Z"
    hosts: [victim-web-01]
    accounts: [svc_backup]
    description: Monthly package patching; svc_backup runs the post-patch checks.
