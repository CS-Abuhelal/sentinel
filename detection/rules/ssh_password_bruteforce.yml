title: SSH password brute force
id: 2b7e4d19-a3c6-4f58-8e0b-6c1d9f2a7e35
status: experimental
description: Many failed SSH passwords for one account from one source in a short window.
correlation:
  type: event_count
  rules:
    - ssh_failed_password
  group-by:
    - host
    - user
    - src_ip
  timespan: 10m
  condition:
    gte: 10
level: medium
tags:
  - attack.credential_access
  - attack.t1110.001
