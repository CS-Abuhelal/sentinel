services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev
      POSTGRES_DB: sentinel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sentinel_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel_dev@db:5432/sentinel
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./contracts:/app/contracts:ro
      - ./ingest:/app/ingest:ro
      - ./backend:/app/backend
      - ./runs:/app/runs:ro

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "pipeline.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel_dev@db:5432/sentinel
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./contracts:/app/contracts:ro
      - ./ingest:/app/ingest:ro
      - ./detection:/app/detection:ro
      - ./agent:/app/agent:ro
      - ./policy:/app/policy:ro
      - ./executor:/app/executor:ro
      - ./pipeline:/app/pipeline:ro
      - ./backend:/app/backend:ro

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - ./contracts:/contracts:ro

volumes:
  sentinel_db:
